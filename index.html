<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EBE POWER — agregaty prądotwórcze. Sprzedaż, dobór, serwis</title>
    <meta
      name="description"
      content="EBE POWER — sprzedaż agregatów prądotwórczych od 2 kW do 2 MW. Dobór mocy, transport, montaż, serwis i przeglądy. Zasilanie awaryjne dla firm, przemysłu i domu."
    />
    <meta name="theme-color" content="#f5faf7" />
    <!--
      Motyw jasny/ciemny: ustawiamy klasę `dark` na <html> jeszcze przed
      załadowaniem React, żeby przy odświeżeniu nie mignęło jasne tło.
      Klucz w localStorage: "ebe-theme" (light | dark; brak = zgodnie z systemem).
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('ebe-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0b1210' : '#f5faf7')
        } catch (e) {}
      })()
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:title" content="EBE POWER — agregaty prądotwórcze" />
    <meta
      property="og:description"
      content="Sprzedaż agregatów prądotwórczych od 2 kW do 2 MW. Dobór mocy, montaż, serwis 24/7."
    />
    <meta property="og:image" content="/images/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
